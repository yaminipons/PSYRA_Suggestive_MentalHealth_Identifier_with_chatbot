<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Reflection Journal — PSYRA</title>
  <meta name="description" content="Private, mindful journaling with emotion-based prompts and chronological reflection history." />
  <link rel="stylesheet" href="/frontend/css/style.css" />
  <link rel="icon" href="/src/assets/images/psyra_mascot_1793120890913.jpg" type="image/jpeg" />
</head>
<body>
  <div id="siteHeaderContainer"></div>

  <main style="padding:2.5rem 0 4rem;">
    <div class="container" style="max-width:880px;">
      <!-- Journal Header -->
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:2rem;">
        <div>
          <span class="hero-tagline">Private Reflections</span>
          <h1 style="font-size:2.2rem;margin-top:0.25rem;">Reflection Journal</h1>
          <p>Put words to what you are experiencing. Private to you and never shared with AI without consent.</p>
        </div>

        <button type="button" class="btn btn-primary" onclick="openNewEntryModal()">
          + Write New Entry
        </button>
      </div>

      <!-- Suggested Prompt Generator Box -->
      <section class="card" id="suggestedPromptBox" style="margin-bottom:2rem;background:var(--bg-subtle);">
        <!-- Prompt injected dynamically -->
      </section>

      <!-- Filter Bar -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
        <h3 style="font-size:1.2rem;">Previous Entries</h3>
        
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <label style="font-size:0.85rem;color:var(--text-muted);" for="journalDateFilter">Filter by date:</label>
          <input 
            type="date" 
            id="journalDateFilter" 
            style="width:auto;padding:0.4rem 0.75rem;font-size:0.85rem;" 
            onchange="filterByDate(this)" 
          />
          <button type="button" class="btn btn-secondary" style="font-size:0.8rem;padding:0.4rem 0.7rem;" onclick="document.getElementById('journalDateFilter').value='';loadJournalEntries();">
            Clear
          </button>
        </div>
      </div>

      <!-- Entries List Container -->
      <div id="journalEntriesList">
        <!-- Injected dynamically -->
      </div>
    </div>
  </main>

  <!-- Entry Modal Dialog -->
  <div class="modal-overlay" id="journalEntryModal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 id="modalJournalTitle">New Journal Entry</h3>
        <button type="button" class="btn-icon" onclick="closeJournalModal()" style="border:none;">✕</button>
      </div>

      <form id="journalEntryForm" onsubmit="handleJournalFormSubmit(event)">
        <input type="hidden" id="journalPromptUsed" />

        <div style="margin-bottom:1rem;">
          <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.35rem;" for="journalTitle">Title</label>
          <input type="text" id="journalTitle" placeholder="e.g., Afternoon Walk & Soft Clouds" required />
        </div>

        <div style="margin-bottom:1rem;">
          <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.35rem;" for="journalEmotion">Associated Headspace</label>
          <select id="journalEmotion">
            <option value="Happy">Happy (Joyful, Energized, Grateful)</option>
            <option value="Neutral" selected>Neutral (Balanced, Steady, Reflective)</option>
            <option value="Stressed">Stressed (Overwhelmed, Racing, Tight)</option>
            <option value="Low">Low (Tired, Tender, Heavy)</option>
          </select>
        </div>

        <div style="margin-bottom:1.5rem;">
          <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:0.35rem;" for="journalContent">Your Thoughts</label>
          <textarea id="journalContent" rows="8" placeholder="Allow your thoughts to pour out freely..." required></textarea>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
          <button type="button" class="btn btn-secondary" onclick="closeJournalModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <div id="siteFooterContainer"></div>

  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/app.js"></script>
  <script src="/frontend/js/journal.js"></script>
</body>
</html>
