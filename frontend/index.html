<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>PSYRA — Welcome</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container center">
    <div class="brand">
      <div class="logo">PS</div>
      <div>
        <h1>PSYRA</h1>
        <p class="lead">Your friendly companion for better days 😊</p>
      </div>
    </div>

    <div id="auth">
      <input id="username" type="text" placeholder="Username" />
      <input id="password" type="password" placeholder="Password" />
      <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
        <button id="loginBtn" class="btn">Login</button>
        <button id="registerBtn" class="btn secondary">Register</button>
      </div>
      <p class="small">By continuing you agree to share your mood data for personal use only.</p>
    </div>
  </div>
  <script src="assets/js/auth.js"></script>
</body>
</html>
