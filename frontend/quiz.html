<!doctype html>
<html>
<head>
  <meta charset="utf-8"/><title>PSYRA — Quick Check-in</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="brand"><div class="logo">QZ</div><div><h2>Quick Check-in</h2><p class="lead">5 quick questions to see how you're doing</p></div></div>

    <form id="quizForm">
      <!-- Q1 -->
      <div class="question">
        <p><strong>1.</strong> How have your energy levels been lately?</p>
        <div class="options">
          <label><input type="radio" name="q1" value="A"> I feel energetic most of the time</label>
          <label><input type="radio" name="q1" value="B"> I have enough energy for daily tasks</label>
          <label><input type="radio" name="q1" value="C"> I often feel tired or drained</label>
          <label><input type="radio" name="q1" value="D"> I struggle to get through most days</label>
        </div>
      </div>

      <!-- Q2 -->
      <div class="question">
        <p><strong>2.</strong> How often do you feel calm and relaxed?</p>
        <div class="options">
          <label><input type="radio" name="q2" value="A"> Almost always - I handle stress well</label>
          <label><input type="radio" name="q2" value="B"> Sometimes</label>
          <label><input type="radio" name="q2" value="C"> Rarely - I often feel tense</label>
          <label><input type="radio" name="q2" value="D"> Almost never - I'm usually anxious</label>
        </div>
      </div>

      <!-- Q3 -->
      <div class="question">
        <p><strong>3.</strong> How connected do you feel to people around you?</p>
        <div class="options">
          <label><input type="radio" name="q3" value="A"> Very connected</label>
          <label><input type="radio" name="q3" value="B"> Somewhat connected</label>
          <label><input type="radio" name="q3" value="C"> Not very connected</label>
          <label><input type="radio" name="q3" value="D"> Isolated</label>
        </div>
      </div>

      <!-- Q4 -->
      <div class="question">
        <p><strong>4.</strong> How well have you been sleeping lately?</p>
        <div class="options">
          <label><input type="radio" name="q4" value="A"> Really well</label>
          <label><input type="radio" name="q4" value="B"> Okay</label>
          <label><input type="radio" name="q4" value="C"> Poorly</label>
          <label><input type="radio" name="q4" value="D"> Very poorly</label>
        </div>
      </div>

      <!-- Q5 -->
      <div class="question">
        <p><strong>5.</strong> How often do you feel hopeful about your future?</p>
        <div class="options">
          <label><input type="radio" name="q5" value="A"> Almost always</label>
          <label><input type="radio" name="q5" value="B"> Often</label>
          <label><input type="radio" name="q5" value="C"> Sometimes</label>
          <label><input type="radio" name="q5" value="D"> Rarely</label>
        </div>
      </div>

      <div style="text-align:center">
        <button type="submit" class="btn">Submit</button>
      </div>
    </form>
  </div>
  <script src="assets/js/quiz.js"></script>
</body>
</html>
